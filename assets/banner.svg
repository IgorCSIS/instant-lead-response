<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="Instant Lead Response: a missed call or web form answered in seconds.">
  <title>Instant Lead Response</title>
  <desc>Three timeline steps at 0, 8 and 12 seconds: the lead arrives, the customer gets an auto-reply that names the job, and the owner is notified on their phone.</desc>

  <rect width="1200" height="300" rx="16" fill="#070E18"/>
  <rect x="0.5" y="0.5" width="1199" height="299" rx="15.5" fill="none" stroke="#1B2A40"/>

  <g transform="translate(66 105) scale(2.75)">
    <rect width="32" height="32" rx="7" fill="#070E18"/>
    <path d="M6.5 8.5h19a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2h-9.6l-4.6 3.4a.6.6 0 0 1-1-.5v-2.9H6.5a2 2 0 0 1-2-2v-9a2 2 0 0 1 2-2z" fill="#F59E0B"/>
    <path d="M17.6 11.6 12.4 18h3.3l-1.3 4.4 5.2-6.4h-3.3z" fill="#070E18"/>
  </g>

  <text x="174" y="126" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="34" font-weight="700" fill="#F8FAFC" letter-spacing="-0.6">Instant Lead Response</text>
  <text x="176" y="160" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="21" fill="#8FA3BC">Missed call or form, answered in seconds</text>
  <circle cx="183" cy="192" r="5" fill="#F59E0B"/>
  <text x="197" y="198" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="18" fill="#8FA3BC">Simulated demo. No SMS is ever sent.</text>

  <g transform="translate(660 54)">
    <rect width="474" height="58" rx="9" fill="#111C2E" stroke="#1B2A40"/>
    <rect x="14" y="13" width="44" height="20" rx="10" fill="#2A1B08"/>
    <text x="36" y="27" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="600" fill="#F59E0B" letter-spacing="0.5">0s</text>
    <text x="70" y="27" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#F8FAFC">Lead received</text>
    <text x="70" y="45" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#FBBF24">Web form, El Cajon: AC not cooling</text>
  </g>
  <g transform="translate(660 120)">
    <rect width="474" height="58" rx="9" fill="#111C2E" stroke="#1B2A40"/>
    <rect x="14" y="13" width="44" height="20" rx="10" fill="#2A1B08"/>
    <text x="36" y="27" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="600" fill="#F59E0B" letter-spacing="0.5">8s</text>
    <text x="70" y="27" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#F8FAFC">Auto-reply sent</text>
    <text x="70" y="45" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#FBBF24">Hi Maria, this is East County Comfort.</text>
  </g>
  <g transform="translate(660 186)">
    <rect width="474" height="58" rx="9" fill="#111C2E" stroke="#1B2A40"/>
    <rect x="14" y="13" width="44" height="20" rx="10" fill="#2A1B08"/>
    <text x="36" y="27" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="600" fill="#F59E0B" letter-spacing="0.5">12s</text>
    <text x="70" y="27" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#F8FAFC">Owner notified</text>
    <text x="70" y="45" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#FBBF24">Maria, AC not cooling, El Cajon, Emergency</text>
  </g>
</svg>
